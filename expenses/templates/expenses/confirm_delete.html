<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm delete</title>
</head>
<body>
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ expense }}"?</p>
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'expenses:dashboard' %}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
